<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Husein Attar — Admin panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#131015; --card:#FFFFFF; --brown:#4A3220; --brown2:#6E4B2A;
  --caramel:#C4813C; --carameld:#9A6227; --beige:#EDD9B7; --line:#E8D9BC;
  --red:#A9442C; --green:#5E7A3A; --shadow:0 3px 12px rgba(74,50,32,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#F1E5CF}
body{background:var(--cream);color:var(--brown);font-family:'Manrope',system-ui,sans-serif;
  max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.serif{font-family:'Playfair Display',serif}

header{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}
.emblem{width:44px;height:44px;border-radius:50%;background:var(--beige);border:1.5px solid var(--carameld);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emblem span{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:10.5px;color:var(--brown)}
header h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:700}
header p{font-size:11.5px;color:var(--brown2)}

.tabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;
  background:var(--cream);z-index:20}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--brown2);
  border-radius:18px;padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.tab.on{background:var(--brown);color:var(--cream);border-color:var(--brown)}

.wrap{padding:6px 14px}
.msg{text-align:center;color:var(--brown2);padding:30px 10px;font-size:13.5px}

/* Katalog ro'yxati */
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
  padding:9px 11px;margin-bottom:8px;box-shadow:var(--shadow)}
.row.arch{opacity:.5}
.row img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--beige);flex-shrink:0}
.row .ph{width:48px;height:48px;border-radius:10px;background:var(--beige);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.rinfo{flex:1;min-width:0}
.rinfo .n{font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rinfo .p{font-size:12.5px;color:var(--carameld);font-weight:800;margin-top:2px}
.rinfo .c{font-size:10.5px;color:var(--brown2);margin-top:1px}
.edit{border:none;background:var(--beige);color:var(--brown);border-radius:10px;
  padding:8px 12px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}

/* Forma */
label.f{display:block;font-size:11.5px;font-weight:800;color:var(--brown2);margin:12px 2px 5px;
  text-transform:uppercase;letter-spacing:.4px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:11px 13px;font-size:14px;font-family:inherit;color:var(--brown);outline:none}
textarea.inp{resize:none;min-height:56px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:1.5px solid var(--line);background:var(--card);color:var(--brown2);
  border-radius:11px;padding:10px 6px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.seg button.on{border-color:var(--caramel);background:var(--beige);color:var(--brown)}
.btn{width:100%;border:none;background:var(--caramel);color:#fff;border-radius:13px;
  padding:14px;font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:14px}
.btn.sec{background:var(--beige);color:var(--brown)}
.btn.danger{background:var(--card);color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.5}
.photobox{display:flex;align-items:center;gap:12px;margin-top:6px}
.photobox img,.photobox .ph{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--beige);
  display:flex;align-items:center;justify-content:center;font-size:26px}
.hint{font-size:11px;color:var(--brown2);margin-top:6px;line-height:1.4}

/* Statistika */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tile{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.tile .v{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--carameld)}
.tile .l{font-size:11.5px;color:var(--brown2);margin-top:3px}

/* Buyurtma */
.ord{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.ord .h{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.ord .m{font-size:12px;color:var(--brown2);margin-top:4px;line-height:1.4}
.ord .t{font-size:13px;font-weight:800;color:var(--carameld);margin-top:5px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brown);color:var(--cream);
  padding:11px 20px;border-radius:22px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;
  z-index:99;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="emblem"><span>Husein Attar</span></div>
  <div><h1>Admin panel</h1><p id="who">Katalog boshqaruvi</p></div>
</header>

<div class="tabs" id="tabs">
  <button class="tab on" data-t="cat">📦 Katalog</button>
  <button class="tab" data-t="add">➕ Qo'shish</button>
  <button class="tab" data-t="ord">🧾 Buyurtmalar</button>
  <button class="tab" data-t="st">📊 Statistika</button>
</div>

<div class="wrap" id="view"><div class="msg">Yuklanmoqda…</div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg){ tg.ready(); tg.expand(); try{tg.setHeaderColor('#131015');tg.setBackgroundColor('#131015');}catch(e){} }
const API = 'https://bonjour-demo-production.up.railway.app';
const INIT = (tg && tg.initData) || '';
const CATS = [{id:'tort',name:'Tortlar',emoji:'🎂'},{id:'kruasan',name:'Kruasanlar',emoji:'🥐'},
  {id:'bulochka',name:'Bulochkalar',emoji:'🥯'},{id:'desert',name:'Desertlar',emoji:'🍰'}];
const fmt = n => (n||0).toLocaleString('ru-RU').replace(/,/g,' ') + " so'm";
let tab='cat', products=[], editing=null;

function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),1900); }

async function api(path, opts={}){
  opts.headers = Object.assign({'X-Init-Data':INIT}, opts.headers||{});
  const r = await fetch(API+path, opts);
  if(r.status===401) throw new Error('auth');
  return r;
}

document.getElementById('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t; editing=null;
  document.getElementById('tabs').querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  render();
});

function catName(id){ const c=CATS.find(x=>x.id===id); return c?c.emoji+' '+c.name:id; }

async function render(){
  const v = document.getElementById('view');
  try{
    if(tab==='cat'){ await renderCat(v); }
    else if(tab==='add'){ renderForm(v, null); }
    else if(tab==='ord'){ await renderOrders(v); }
    else if(tab==='st'){ await renderStats(v); }
  }catch(e){
    v.innerHTML = e.message==='auth'
      ? `<div class="msg">🔒 Ruxsat yo'q.<br>Panelni <b>admin bot</b> orqali oching.</div>`
      : `<div class="msg">⚠️ Xato: ${e.message}<br>Qayta urinib ko'ring.</div>`;
  }
}

async function renderCat(v){
  const r = await api('/api/admin/list'); const d = await r.json();
  products = d.products||[];
  if(editing!==null){ renderForm(v, products.find(p=>p.id===editing)); return; }
  if(!products.length){ v.innerHTML=`<div class="msg">Katalog bo'sh. ➕ Qo'shish orqali mahsulot qo'shing.</div>`; return; }
  v.innerHTML = products.map(p=>`
    <div class="row ${p.archived?'arch':''}">
      ${p.img?`<img src="${p.img}" alt="">`:`<div class="ph">🍰</div>`}
      <div class="rinfo">
        <div class="n">${p.name}${p.archived?' · yashirin':''}</div>
        <div class="p">${fmt(p.price)}</div>
        <div class="c">${catName(p.cat)}${p.badge?' · '+(p.badge==='hit'?'XIT':'YANGI'):''}</div>
      </div>
      <button class="edit" onclick="openEdit(${p.id})">Tahrir</button>
    </div>`).join('');
}

window.openEdit = id => { editing=id; render(); };

function renderForm(v, p){
  const isNew = !p;
  const badge = p ? (p.badge||'') : '';
  v.innerHTML = `
    <label class="f">Nomi</label>
    <input class="inp" id="f_name" value="${p?escapeAttr(p.name):''}" placeholder="Masalan: Shokoladli tort">
    <label class="f">Kategoriya</label>
    <div class="seg" id="f_cat">${CATS.map(c=>`<button data-c="${c.id}" class="${(p?p.cat:'tort')===c.id?'on':''}">${c.emoji} ${c.name}</button>`).join('')}</div>
    <label class="f">Narxi (so'm)</label>
    <input class="inp" id="f_price" type="number" inputmode="numeric" value="${p?p.price:''}" placeholder="25000">
    <label class="f">Tavsif</label>
    <textarea class="inp" id="f_desc" placeholder="Qisqa tavsif">${p?escapeHtml(p.desc||''):''}</textarea>
    <label class="f">Belgi</label>
    <div class="seg" id="f_badge">
      <button data-b="" class="${badge===''?'on':''}">Yo'q</button>
      <button data-b="hit" class="${badge==='hit'?'on':''}">🔥 XIT</button>
      <button data-b="new" class="${badge==='new'?'on':''}">🆕 YANGI</button>
    </div>
    ${!isNew?`
    <label class="f">Rasm</label>
    <div class="photobox">
      ${p.img?`<img id="f_prev" src="${p.img}">`:`<div class="ph" id="f_prev">🍰</div>`}
      <div style="flex:1">
        <button class="btn sec" style="margin:0" onclick="document.getElementById('f_file').click()">📷 Rasm yuklash</button>
        <div class="hint">Kvadrat rasm eng chiroyli ko'rinadi.</div>
      </div>
    </div>
    <input type="file" id="f_file" accept="image/*" style="display:none">`:''}
    <button class="btn" id="f_save">💾 Saqlash</button>
    ${!isNew?`<button class="btn sec" id="f_arch">${p.archived?"👁 Ko'rsatish":"🙈 Vaqtincha yashirish"}</button>
    <button class="btn danger" id="f_del">🗑 O'chirish</button>`:''}
    <button class="btn sec" id="f_cancel">← Orqaga</button>
  `;
  // segment tanlash
  v.querySelectorAll('#f_cat button').forEach(b=>b.onclick=()=>{v.querySelectorAll('#f_cat button').forEach(x=>x.classList.toggle('on',x===b));});
  v.querySelectorAll('#f_badge button').forEach(b=>b.onclick=()=>{v.querySelectorAll('#f_badge button').forEach(x=>x.classList.toggle('on',x===b));});
  document.getElementById('f_cancel').onclick=()=>{editing=null;tab='cat';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==='cat'));render();};
  document.getElementById('f_save').onclick=()=>saveProduct(p);
  if(!isNew){
    document.getElementById('f_file').onchange=e=>uploadPhoto(p.id, e.target.files[0]);
    document.getElementById('f_arch').onclick=()=>archiveProduct(p);
    document.getElementById('f_del').onclick=()=>delProduct(p);
  }
}

function selVal(id, attr){ const b=document.querySelector('#'+id+' button.on'); return b?b.dataset[attr]:''; }

async function saveProduct(p){
  const name=document.getElementById('f_name').value.trim();
  const price=parseInt(document.getElementById('f_price').value)||0;
  if(!name){ toast('Nomini yozing'); return; }
  if(price<=0){ toast('Narxini yozing'); return; }
  const body={ id:p?p.id:undefined, name, price, cat:selVal('f_cat','c')||'tort',
    desc:document.getElementById('f_desc').value.trim(), badge:selVal('f_badge','b')||null };
  document.getElementById('f_save').disabled=true;
  try{
    const r=await api('/api/admin/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    toast('✅ Saqlandi');
    editing = p ? p.id : d.product.id;
    tab='cat'; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==='cat'));
    render();
  }catch(e){ toast('Xato: '+e.message); document.getElementById('f_save').disabled=false; }
}

async function uploadPhoto(id, file){
  if(!file) return;
  toast('📤 Yuklanmoqda…');
  const fd=new FormData(); fd.append('id', id); fd.append('file', file);
  try{
    const r=await api('/api/admin/photo',{method:'POST',body:fd});
    const d=await r.json();
    if(d.ok){ const prev=document.getElementById('f_prev');
      if(prev){ const img=document.createElement('img'); img.id='f_prev'; img.src=d.img; prev.replaceWith(img); }
      toast('✅ Rasm yuklandi'); }
    else toast('Xato');
  }catch(e){ toast('Xato: '+e.message); }
}

async function archiveProduct(p){
  try{ await api('/api/admin/archive',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:p.id, archived:!p.archived})});
    toast(p.archived?'👁 Ko\'rsatildi':'🙈 Yashirildi'); editing=null;
    tab='cat'; render();
  }catch(e){ toast('Xato: '+e.message); }
}

async function delProduct(p){
  if(!confirm(`"${p.name}" o'chirilsinmi?`)) return;
  try{ await api('/api/admin/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:p.id})});
    toast('🗑 O\'chirildi'); editing=null; tab='cat'; render();
  }catch(e){ toast('Xato: '+e.message); }
}

async function renderOrders(v){
  const r=await api('/api/admin/orders'); const d=await r.json();
  const os=d.orders||[];
  if(!os.length){ v.innerHTML=`<div class="msg">Hozircha buyurtma yo'q.<br>Mijoz Mini App'dan buyurtma bersa, shu yerda ko'rinadi.</div>`; return; }
  v.innerHTML = os.map(o=>{
    const items=(o.items||[]).map(it=>`${it.name} ×${it.qty}`).join(', ');
    const when=new Date((o.ts||0)*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<div class="ord"><div class="h"><span>#${o.oid} · ${o.name||'—'}</span><span>${when}</span></div>
      <div class="m">📞 ${o.tel||'—'} · ${o.mode==='pickup'?'🏪 olib ketish':'🚚 yetkazish'} · ${o.payment==='cash'?'💵':'💳'}<br>${items}</div>
      <div class="t">${fmt(o.total)}</div></div>`;
  }).join('');
}

async function renderStats(v){
  const r=await api('/api/admin/stats'); const s=await r.json();
  v.innerHTML = `<div class="tiles">
    <div class="tile"><div class="v">${s.products}</div><div class="l">Faol mahsulot</div></div>
    <div class="tile"><div class="v">${s.archived}</div><div class="l">Yashirilgan</div></div>
    <div class="tile"><div class="v">${s.orders}</div><div class="l">Buyurtmalar</div></div>
    <div class="tile"><div class="v">${fmt(s.revenue)}</div><div class="l">Umumiy summa</div></div>
  </div>
  <div class="hint" style="margin-top:14px;text-align:center">Demo ma'lumotlari — real do'konda jonli yangilanadi.</div>`;
}

function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

render();
</script>
</body>
</html>
