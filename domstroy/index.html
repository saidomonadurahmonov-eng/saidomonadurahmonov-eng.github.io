<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Дом Строй — Qurilish mollari markazi</title>
<meta name="theme-color" content="#EF7F1A">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F4F5F7;
  --card:#ffffff;
  --card2:#EDEFF2;
  --text:#1F2A37;
  --hint:#6B7686;
  --accent:#EF7F1A;
  --accent-dark:#D96F0E;
  --navy:#1F2A37;
  --line:rgba(31,42,55,.08);
  --green:#1d9e75;
  --red:#e24b4a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:72px}
.view{display:none}
.view.active{display:block}
.header{padding:14px 16px 6px}
.header h1{font-size:20px}

/* brend paneli */
.brandbar{background:var(--navy);padding:14px 16px;border-radius:0 0 22px 22px}
.brandrow{display:flex;align-items:center;gap:10px}
.blogo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
.bname{color:#fff;font-size:21px;font-weight:800;letter-spacing:.3px;line-height:1.1}
.bname span{color:var(--accent)}
.bsub{color:#93a0b0;font-size:11px;margin-top:2px}
.lbtn{padding:6px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#cfd7e0;font-size:12.5px;font-weight:700;cursor:pointer}
.lbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.search{margin:12px 0 0;display:flex;gap:8px}
.search input{flex:1;border:none;border-radius:12px;padding:11px 14px;font-size:15px;background:#fff;color:#1a1a1a;outline:none}
.chanbtn{width:100%;margin-top:10px;border:none;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.chanbtn:active{transform:scale(.98)}
.updated{padding:6px 16px 0;color:var(--hint);font-size:11px}

.section-title{font-size:17px;font-weight:700;margin:18px 16px 10px;letter-spacing:-.2px}
.shelf{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.scard{flex:0 0 150px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 1px 4px rgba(31,42,55,.05)}
.scard img{width:100%;height:150px;object-fit:contain;display:block;background:#fff}
.scard .sbadge{position:absolute;top:8px;left:8px;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--red)}
.scard .sbadge.new{background:var(--green)}
.scard .sbadge.top{background:var(--navy)}
.scard .snm{font-size:12px;padding:8px 10px 2px;height:38px;overflow:hidden;line-height:1.25}
.scard .spr{font-size:13.5px;font-weight:700;padding:0 10px 10px;color:var(--accent-dark)}
.oldp{color:var(--hint);text-decoration:line-through;font-weight:400;font-size:11px;margin-right:5px}

.cats{display:grid;grid-auto-flow:column;grid-template-rows:1fr 1fr;grid-auto-columns:minmax(146px,1fr);gap:10px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cattile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:3px;white-space:nowrap}
.cattile.active{background:var(--navy);border-color:var(--navy)}
.cattile .cnm{font-size:13px;font-weight:600}
.cattile .cnt{font-size:11px;color:var(--hint)}
.cattile.active .cnm{color:#fff}
.cattile.active .cnt{color:#93a0b0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 18px}
.pcard{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(31,42,55,.05)}
.pimg{position:relative}
.pimg img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#fff}
.discbadge{position:absolute;top:9px;left:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:9px}
.qadd{position:absolute;right:9px;bottom:9px;width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(31,42,55,.25)}
.qadd:active{transform:scale(.92)}
.pinfo{padding:10px 12px 13px;cursor:pointer}
.pbrand{font-size:10.5px;color:var(--hint);text-transform:uppercase;letter-spacing:.4px;height:14px;overflow:hidden}
.pname{font-size:13px;line-height:1.3;height:34px;overflow:hidden;margin-top:2px}
.pprice{margin-top:6px;font-size:15px;font-weight:700;color:var(--accent-dark)}
.empty{text-align:center;color:var(--hint);padding:40px 20px;font-size:14px}

/* savat */
.cartlist{padding:0 16px}
.cartlist .ci{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cartlist .ci img{width:54px;height:54px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.cartlist .ci .nm{flex:1;font-size:13px;line-height:1.25}
.cartlist .ci .nm .pr{color:var(--accent-dark);font-weight:700;margin-top:3px}
.cartlist .ci .ctr{display:flex;align-items:center;gap:8px}
.cartlist .ci .ctr button{width:30px;height:30px;border-radius:8px;border:none;background:var(--card2);font-size:16px;cursor:pointer;color:var(--text)}
.cartlist .ci .ctr .q{min-width:24px;text-align:center;font-weight:700;font-size:14px}
.cartbox{margin:12px 16px;background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin:8px 0}
.bigbtn{width:100%;border:none;border-radius:12px;padding:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.bigbtn.ghost{background:var(--card2);color:var(--text)}
.finput{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:15px;background:var(--card2);color:var(--text);outline:none;margin-top:8px}
.flabel{font-size:13px;font-weight:700;margin-top:12px;color:var(--hint)}
.vchip{padding:9px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;margin:6px 6px 0 0;display:inline-block}
.vchip.sel{background:var(--navy);color:#fff;border-color:var(--navy)}

/* filiallar */
.branch{margin:10px 16px;background:var(--card);border-radius:14px;padding:13px 15px;border:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.branch .ic{font-size:20px;margin-top:1px}
.branch .bt{font-size:14px;font-weight:700}
.branch .ba{font-size:12.5px;color:var(--hint);margin-top:2px;line-height:1.4}

/* aloqa */
.panel{margin:12px 16px;background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--line)}
.panel h3{font-size:15px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.row .k{color:var(--hint);flex:0 0 auto}
.row .v{font-weight:600;text-align:right;word-break:break-word}
.row .v a{color:var(--accent-dark);text-decoration:none}
.promo{margin:12px 16px;background:linear-gradient(135deg,#EF7F1A,#D95E0E);border-radius:16px;padding:16px;color:#fff}
.promo .pt{font-size:15px;font-weight:800;line-height:1.3}
.promo .pd{font-size:12.5px;margin-top:5px;opacity:.92;line-height:1.45}

/* pastki menyu */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);box-shadow:0 -1px 8px rgba(31,42,55,.08);display:flex;z-index:40}
.nav button{flex:1;border:none;background:none;color:var(--hint);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
.nav button .ic{font-size:20px}
.nav button.active{color:var(--accent-dark)}
.nav .badge{position:absolute;top:4px;right:50%;transform:translateX(18px);background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-height:88vh;border-radius:18px 18px 0 0;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet img.big{width:100%;aspect-ratio:1/1;max-height:58vh;object-fit:contain;background:#fff}
.sheet .body{padding:14px 16px}
.sheet h2{font-size:17px;line-height:1.3}
.sheet .price{font-size:21px;font-weight:800;color:var(--accent-dark);margin:8px 0 2px}
.sheet .meta{color:var(--hint);font-size:13px;margin-bottom:12px;line-height:1.5}
.qtyrow{display:flex;align-items:center;gap:14px;margin:10px 0 16px}
.qtyrow button{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);font-size:22px;cursor:pointer;border:1px solid var(--line)}
.qtyrow .qv{font-size:18px;font-weight:700;width:72px;text-align:center}
.stockchip{display:inline-block;background:rgba(29,158,117,.12);color:var(--green);font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;margin-top:6px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;display:none}
.demo-tag{position:fixed;top:8px;right:8px;background:rgba(31,42,55,.85);color:#fff;font-size:10px;font-weight:700;padding:4px 9px;border-radius:8px;z-index:45;letter-spacing:.5px}
</style>
</head>

<!-- FILIALLAR -->
<div class="view" id="v-branches">

<div class="modal" id="pmodal"><div class="sheet" id="psheet"></div></div>

    <h2 id="mapT">Manzilni belgilang</h2>
    <div id="mapHint" style="color:var(--hint);font-size:12.5px;margin:6px 0 10px"></div>
  </div>

/* GPS orqali joylashuv.
   ACC_GOOD dan yaxshi bo'lsa — ishonamiz; past bo'lsa (masalan kompyuterda IP orqali
   100 km xato) — avtomatik kartani ochamiz, mijoz pinni aniq joyga qo'yadi. */
const ACC_GOOD = 150;    // metr
const ACC_JUNK = 5000;   // bundan yomon = IP-geolokatsiya, koordinataga ishonmaymiz
function geoAniqla(){
  if(!navigator.geolocation){ toast(t('loc_err')); openMap(); return; }
  geoBusy=true; renderCart();
  let best=null, done=false;
  const watch = navigator.geolocation.watchPosition(
    pos=>{
      const acc = pos.coords.accuracy || 99999;
      if(!best || acc < best.acc) best = {lat:pos.coords.latitude, lon:pos.coords.longitude, acc};
      if(acc <= ACC_GOOD && !done){ finish(); }   // yetarli aniq — darrov to'xtaymiz
    },
    ()=>{ if(!done){ finish(true); } },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );
  // 12 soniyada eng yaxshi natijani olamiz
  const timer = setTimeout(()=>finish(), 12000);
  function finish(err){
    if(done) return; done=true;
    clearTimeout(timer);
    try{ navigator.geolocation.clearWatch(watch); }catch(e){}
    geoBusy=false;
    if(err || !best){ renderCart(); toast(t('loc_err')); openMap(); return; }
    ordLoc = {lat:best.lat, lon:best.lon, acc:best.acc};
    ordLocSrc='gps';
    if(best.acc > ACC_GOOD){        // aniqlik past — kartada tasdiqlatamiz
      toast(t('loc_low'));
      openMap();
    } else {
      renderCart();
    }
  }
}

/* Kartadan tanlash (Leaflet — kerak bo'lganda yuklanadi) */
let _map=null, _pin=null;
function openMap(){
  el('mapmodal').classList.add('show');
  if(window.L){ initMap(); return; }
  const css=document.createElement('link'); css.rel='stylesheet';
  css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  const s=document.createElement('script');
  s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload=initMap;
  document.body.appendChild(s);
}
function initMap(){
  // GPS aniqligi juda past bo'lsa (IP orqali) koordinataga ishonmaymiz — Qo'qon markazidan boshlaymiz
  const trust = ordLoc && !(ordLocSrc==='gps' && ordLoc.acc > ACC_JUNK);
  const start = trust ? [ordLoc.lat, ordLoc.lon] : [40.5286, 70.9425]; // Qo'qon markazi
  if(!_map){
    _map = L.map('mapbox').setView(start, trust?16:13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(_map);
    _pin = L.marker(start, {draggable:true}).addTo(_map);
    _map.on('click', e=>_pin.setLatLng(e.latlng));
  } else {
    _map.setView(start, trust?16:13); _pin.setLatLng(start);
  }
  setTimeout(()=>_map.invalidateSize(), 150);
}
function mapTasdiq(){
  if(!_pin) return;
  const ll = _pin.getLatLng();
  ordLoc = {lat:ll.lat, lon:ll.lng, acc:0, note:el('map-note').value.trim()};
  ordLocSrc='map';
  closeMap(); renderCart();
}
function closeMap(){ el('mapmodal').classList.remove('show'); }
el('mapmodal').addEventListener('click', e=>{ if(e.target.id==='mapmodal') closeMap(); });

function telUlash(){
  if(!(tg && tg.requestContact)){ toast('Telegram ichida ishlaydi'); return; }
  try{
    tg.requestContact((ok, ev)=>{
      let ph='';
      try{ ph = ev && ev.responseUnsafe && ev.responseUnsafe.contact ? ev.responseUnsafe.contact.phone_number : ''; }catch(e){}
      if(ok && ph){
        if(!ph.startsWith('+')) ph='+'+ph;
        saveProf({tel:ph});
        const inp=el('o-tel')||el('p-tel'); if(inp) inp.value=ph;
        toast(t('saqlandi')); renderCart(); renderProfile();
      } else if(!ok){ toast('✖️'); }
    });
  }catch(e){ toast('Telegram ichida ishlaydi'); }
}

function order(total){
  const name = el('o-name').value.trim();
  const tel = el('o-tel').value.trim();
  if(!name){ toast(t('xato_ism')); return; }
  if(!tel){ toast(t('xato_tel')); return; }
  if(ordMode==='deliv' && !ordLoc){ toast(t('xato_manzil')); return; }
  const pay = payFor(total);
  const items = Object.keys(cart).map(id=>{
    const p=prodById(id);
    return {id, sku:p.sku, name:p.name, qty:cart[id], price:p.price};
  });
  const payload = {
    type:'order', shop:'domstroy', name, tel, total,
    mode: ordMode,
    branch: ordMode==='pickup' ? (BRANCHES[ordBranch].uz) : null,
    lat: ordMode==='deliv' && ordLoc ? ordLoc.lat : null,
    lon: ordMode==='deliv' && ordLoc ? ordLoc.lon : null,
    loc_src: ordMode==='deliv' ? ordLocSrc : null,
    loc_note: ordMode==='deliv' && ordLoc && ordLoc.note ? ordLoc.note : null,
    payment: ordMode==='pickup' ? 'store' : pay,
    vehicle: vehicleFor(total),
    items,
  };
  if (tg && tg.sendData) {
    try { tg.sendData(JSON.stringify(payload)); } catch(e) {}
  }
  // profil + tarixga saqlash (keyingi buyurtmada avto-to'ldiriladi)
  saveProf({name, tel, addr: ordMode==='deliv' ? ordLoc : (loadProf().addr||null)});
  pushHist({ts:Date.now(), total, n:items.reduce((a,i)=>a+i.qty,0), mode:ordMode, payment:payload.payment});
  cart={}; updateBadge();
  el('cartBody').innerHTML = `<div class="empty" style="padding-top:60px">
    <div style="font-size:44px">🎉</div><br>
    <b style="font-size:17px;color:var(--text)">${t('ord_ok')}</b><br><br>
    ${t('ord_note')}<br><br>
    <span style="font-size:12px">${t('ord_demo')}</span><br><br>
    <button class="bigbtn ghost" style="max-width:280px" onclick="nav('shop')">${t('davom')}</button>
  </div>`;
  renderProfile();
}

/* kabinet */
function renderProfile(){
  const body = el('profBody');
  if(!body) return;
  const prof = loadProf();
  const name = prof.name || '';   // Telegram taxallusi emas
  const hist = loadHist();
  const histHtml = hist.length
    ? hist.map(h=>{
        const d = new Date(h.ts);
        const dd = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
        return `<div class="row">
          <span class="k">${dd} · ${h.n} ${t('dona_s')}</span>
          <span class="v">${fmt(h.total)}<br><span style="font-size:11px;color:var(--green);font-weight:600">${t('holat')}</span></span>
        </div>`;
      }).join('')
    : `<div style="color:var(--hint);font-size:13.5px;padding:6px 0">${t('tarix_bosh')}</div>`;
  body.innerHTML = `
    <div class="panel">
      <h3>${t('profil')}</h3>
      <div class="flabel">${t('ism')}</div>
      <input class="finput" id="p-name" value="${esc(name)}" placeholder="${t('ism_ph')}">
      <div style="font-size:11.5px;color:var(--hint);margin-top:4px">${t('ism_hint')}</div>
      <div class="flabel">${t('tel')}</div>
      <input class="finput" id="p-tel" type="tel" value="${esc(prof.tel||'')}" placeholder="+998 __ ___-__-__">
      ${(tg && tg.requestContact) ? `<span class="vchip" onclick="telUlash()">${t('tel_ulash')}</span>` : ''}
      <button class="bigbtn" onclick="profSaqla()">${t('saqlash')}</button>
    </div>
    <div class="panel">
      <h3>${t('saved_addr')}</h3>
      <div style="color:var(--hint);font-size:13px;line-height:1.5">${
        prof.addr ? `${prof.addr.lat.toFixed(5)}, ${prof.addr.lon.toFixed(5)}${prof.addr.note?' · '+esc(prof.addr.note):''}` : t('addr_yoq')
      }</div>
    </div>
    <div class="panel">
      <h3>${t('tarix')}</h3>
      ${histHtml}
    </div>`;
}
function profSaqla(){
  saveProf({name: el('p-name').value.trim(), tel: el('p-tel').value.trim()});
  toast(t('saqlandi')); renderCart();
}

/* navigatsiya */
function nav(v){
  curView=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  const ok = ['shop','cart','branches','profile','info'];
  el('v-'+(ok.includes(v)?v:'shop')).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  window.scrollTo(0,0);
  if(v==='cart') renderCart();
  if(v==='profile') renderProfile();
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.v)));

load();
